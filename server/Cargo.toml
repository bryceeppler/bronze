[package]
name = "bronze-sync"
version = "0.1.2"
edition = "2024"
rust-version = "1.99"
license = "MIT"
publish = false

[dependencies]
bronze-wire = { path = "../wire" }
axum = { version = "0.8.9", default-features = false, features = ["http1", "tokio"] }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"] }
rusqlite = { version = "0.43.0", features = ["bundled"] }
sha2 = "0.11.1"
subtle = "2.6.1"
getrandom = "0.4.3"

[dev-dependencies]
reqwest = { version = "0.13.5", default-features = false }
tempfile = "3"
tokio = { version = "1.54.1", features = ["io-util"] }

[workspace]
