<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1280 640" width="1280" height="640">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#26211e"/>
      <stop offset="1" stop-color="#121110"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.8" cy="1.05" r="0.6" gradientTransform="translate(0.8 1.05) scale(1 1.4) translate(-0.8 -1.05)">
      <stop offset="0" stop-color="#d78c4b" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#d78c4b" stop-opacity="0"/>
    </radialGradient>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="28" flood-color="#000" flood-opacity="0.55"/>
    </filter>
  </defs>
  <rect width="1280" height="640" fill="url(#wall)"/>
  <rect width="1280" height="640" fill="url(#glow)"/>
  <image href="logo-dark.svg" x="96" y="148" width="472" height="57.3"/>
  <g font-family="Inter" fill="#ececee">
    <text x="96" y="302" font-size="40" font-weight="600" letter-spacing="-0.6">Select anything. Press a key.</text>
    <text x="96" y="352" font-size="40" font-weight="600" letter-spacing="-0.6" fill="#e3a36a">It lands in Bronze.</text>
    <text x="96" y="414" font-size="22" fill="#a1a1a6">A capture panel for notes and prompts on macOS,</text>
    <text x="96" y="446" font-size="22" fill="#a1a1a6">Windows and Linux, with end-to-end encrypted sync</text>
    <text x="96" y="478" font-size="22" fill="#a1a1a6">you host yourself.</text>
    <text x="96" y="552" font-size="18" font-weight="500" fill="#8e8e93" letter-spacing="0.4">Rust  ·  MIT  ·  github.com/bryceeppler/bronze</text>
  </g>
  <image href="../../docs/media/panel-dark.png" x="836" y="104" width="360" height="640" filter="url(#lift)"/>
</svg>
